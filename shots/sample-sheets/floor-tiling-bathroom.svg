<text x="112.94788273615634" y="290" font-size="8" text-anchor="middle">3070 mm E depth</text></svg><text x="227" y="14" font-size="2.2">PROPOSED FLOOR TILE SET-OUT · Bathroom Concept · Bathroom</text><text x="227" y="18.1" font-size="2.2">FOR TILER REVIEW · NOT AS-BUILT · NOT FOR ORDERING</text><text x="227" y="22.2" font-size="2.2">Zone: room · long edge axis: y</text><text x="227" y="26.299999999999997" font-size="2.2">Origin: a tile's west edge from the finished west face, its south edge from the</text><text x="227" y="30.4" font-size="2.2">finished south face.</text><text x="227" y="34.5" font-size="2.2">X 0 P mm · Y 0 P mm</text><text x="227" y="38.599999999999994" font-size="2.2">tile length: 600 mm P</text><text x="227" y="42.699999999999996" font-size="2.2">tile width: 300 mm P</text><text x="227" y="46.8" font-size="2.2">grout joint: 4 mm P</text><text x="227" y="50.9" font-size="2.2">origin X: 0 mm P</text><text x="227" y="55" font-size="2.2">origin Y: 0 mm P</text><text x="227" y="59.099999999999994" font-size="2.2">west: finished face of wall_w (right): -25 mm E</text><text x="227" y="63.199999999999996" font-size="2.2">east: finished face of wall_e (right): 2135 mm E</text><text x="227" y="67.3" font-size="2.2">north: finished face of wall_n (right): -25 mm E</text><text x="227" y="71.39999999999999" font-size="2.2">south: finished face of wall_s (right): 3045 mm E</text><text x="227" y="75.5" font-size="2.2">west cut: 300 (full) mm</text><text x="227" y="79.6" font-size="2.2">east cut: 32 mm</text><text x="227" y="83.69999999999999" font-size="2.2">north cut: 50 mm</text><text x="227" y="87.8" font-size="2.2">south cut: 600 (full) mm</text><text x="227" y="91.89999999999999" font-size="2.2">Legend: orange cut · white full · red origin axes</text><text x="227" y="96" font-size="2.2">Green dashed fall planes · brown waste c/l, shaded grate from its drain brief ·</text><text x="227" y="100.1" font-size="2.2">blue doorway</text><text x="227" y="104.19999999999999" font-size="2.2">SC site-confirmed · M measured · PUB published · P proposed · E estimated · ?</text><text x="227" y="108.3" font-size="2.2">unknown</text><text x="227" y="112.39999999999999" font-size="2.2">Confirm perimeter / doorway joints, drain apertures and slope-break cuts.</text><text x="227" y="116.49999999999999" font-size="2.2">Field note: 300 × 600 sandy beige matte (Tile Wizards porcelain, colour 'Beige';</text><text x="227" y="120.6" font-size="2.2">code not legible in the photo). Long side runs toward the window wall and</text><text x="227" y="124.69999999999999" font-size="2.2">continues up it. Full tiles start at the doorway.</text><text x="227" y="128.79999999999998" font-size="2.2">W1 Lauxes Next Gen 35 channel 1000 × 100 × 35, brushed nickel, 50 mm outlet</text><text x="227" y="132.89999999999998" font-size="2.2">WO50-BN: centre line start: X 75 mm after a tile start (over tile), Y 71 mm after</text><text x="227" y="137" font-size="2.2">a tile start (over tile); end: X 75 mm after a tile start (over tile), Y 467 mm</text><text x="227" y="141.1" font-size="2.2">after a tile start (over tile); grate 100 × 1000 mm; west edge 25 mm after a tile</text><text x="227" y="145.2" font-size="2.2">start (over tile), east edge 125 mm after a tile start (over tile), north edge 71</text><text x="227" y="149.29999999999998" font-size="2.2">mm after a tile start (over tile), south edge 467 mm after a tile start (over</text><text x="227" y="153.39999999999998" font-size="2.2">tile)</text><text x="227" y="157.5" font-size="2.2">W2 Kano 316 tile-insert waste 120 × 120, brushed nickel, 50 mm outlet: centre</text><text x="227" y="161.6" font-size="2.2">point: X 168 mm after a tile start (over tile), Y 269 mm after a tile start (over</text><text x="227" y="165.7" font-size="2.2">tile); grate 120 × 120 mm; west edge 108 mm after a tile start (over tile), east</text><text x="227" y="169.79999999999998" font-size="2.2">edge 228 mm after a tile start (over tile), north edge 209 mm after a tile start</text><text x="227" y="173.89999999999998" font-size="2.2">(over tile), south edge 329 mm after a tile start (over tile); tile insert: cut a</text><text x="227" y="178" font-size="2.2">tile piece to fill the insert as well as the opening around it</text><text x="227" y="182.1" font-size="2.2">UNRESOLVED: door door_s transition: finished face or real clear width unresolved</text><text x="227" y="186.2" font-size="2.2">UNRESOLVED: fall plane Shower: slope/levels unresolved</text><text x="227" y="190.29999999999998" font-size="2.2">UNRESOLVED: fall plane Beside the shower (under the bath): slope/levels unresolved</text><text x="227" y="194.39999999999998" font-size="2.2">UNRESOLVED: fall plane Dry area: slope/levels unresolved</text><text x="227" y="198.49999999999997" font-size="2.2">REVIEW: Plane &quot;Shower&quot; has no derived heights: unknown Lauxes Next Gen 35 channel</text><text x="227" y="202.6" font-size="2.2">1000 × 100 × 35, brushed nickel, 50 mm outlet WO50-BN level, fall or a control</text><text x="227" y="206.7" font-size="2.2">level.</text><text x="227" y="210.79999999999998" font-size="2.2">REVIEW: Plane &quot;Beside the shower (under the bath)&quot; has no derived heights: unknown</text><text x="227" y="214.89999999999998" font-size="2.2">Kano 316 tile-insert waste 120 × 120, brushed nickel, 50 mm outlet level, fall or</text><text x="227" y="218.99999999999997" font-size="2.2">a control level.</text><text x="227" y="223.1" font-size="2.2">REVIEW: Plane &quot;Dry area&quot; has no derived heights: unknown Kano 316 tile-insert</text><text x="227" y="227.2" font-size="2.2">waste 120 × 120, brushed nickel, 50 mm outlet level, fall or a control level.</text><text x="227" y="231.29999999999998" font-size="2.2">REVIEW: Grate outlines come from the linked drain briefs. Confirm clearance, edge</text><text x="227" y="235.39999999999998" font-size="2.2">joints and cut shape on site.</text><text x="227" y="239.49999999999997" font-size="2.2">REVIEW: east cut is 32 mm: narrow piece for tiler review.</text><text x="227" y="243.59999999999997" font-size="2.2">REVIEW: Tiles cross floor-plane boundaries. Confirm slope-break cuts and movement</text><text x="227" y="247.7" font-size="2.2">joints with the tiler.</text><text x="12" y="275" font-size="2.4">Diagram scaled to fit; use written dimensions in mm. Plan X right, Y down.</text></svg>